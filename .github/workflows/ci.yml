name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Rapid pushes to the same PR cancel the outdated run instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # pnpm/action-setup installs pnpm WITHOUT running it, so it works
      # even before Node is configured (runs on the action's own Node).
      # No `version:` input on purpose — the action reads it from the
      # packageManager field of package.json, so an upgrade edits one file
      # (pinned by tests/workflows.test.ts).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The eight gates (lint → typecheck → test → check-config → build →
      # check-content → check-links → check-i18n) live in one composite
      # action so the auto-content pipeline verifies drafts with the exact
      # same definition before opening a PR.
      - name: Quality gates
        uses: ./.github/actions/gates
        with:
          site-url: ${{ vars.SITE_URL || 'https://anvil.wiki' }}

      # TEMPORARY DIAGNOSTICS (2026-10-27): CI red while every gate passes
      # locally; job logs need admin rights to download, so on failure this
      # re-runs each (fast) gate and pushes the failing lines out as
      # ::error:: annotations, which ARE readable via the public API. Remove
      # after the root cause is fixed.
      - name: Diagnostics — re-run gates, emit errors as annotations (temporary)
        if: failure()
        run: |
          emit() { tail -c 2500 2>/dev/null <<< "$2" | grep -aiE "error TS[0-9]|Error:|ELIFECYCLE|✖|✗|failed|missing" | sort -u | head -6 | while IFS= read -r line; do echo "::error ::[$1] ${line:0:200}"; done; }
          emit lint "$(pnpm lint 2>&1)"
          emit typecheck "$(pnpm typecheck 2>&1)"
          emit test "$(pnpm test 2>&1)"
          emit check-config "$(pnpm check-config 2>&1)"
          emit check-content "$(pnpm check-content 2>&1)"
          emit check-i18n "$(pnpm check-i18n --strict-ui 2>&1)"
          if [ -d dist ]; then emit check-links "$(pnpm check-links 2>&1)"; fi

  # tools/anvil-ops is excluded from the root tsconfig/eslint/workspace, so
  # its gates must run separately — without this job, PRs touching the ops
  # CLI/MCP would land on main with zero test signal (first failure would
  # surface only at release time).
  ops-toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/anvil-ops
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: tools/anvil-ops/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates (typecheck + tests + build)
        run: pnpm typecheck && pnpm test && pnpm build
