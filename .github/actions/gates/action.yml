name: 'AnvilWiki quality gates'
description: >-
  The eight validation gates shared by CI and the content pipeline. Every gate
  can fail the run — a draft PR from the pipeline is only created after all
  eight pass, and CI blocks on the same definition, so the two paths verify
  content with the exact same standard — no drift between the workflows.
inputs:
  site-url:
    description: 'SITE_URL for the build step (CI passes vars.SITE_URL; falls back to the demo domain).'
    required: false
    default: 'https://anvil.wiki'

runs:
  using: 'composite'
  steps:
    # TEMPORARY DIAGNOSTICS (2026-10-27): CI fails inside this composite on
    # Linux in ~39s while every gate passes locally on Windows. Every gate
    # tees its output to /tmp/gate-*.log; the calling workflow (ci.yml) dumps
    # the tails into its step summary + ::error:: annotations at the job
    # level, where they are readable via the public API without admin rights
    # (job logs are not). Remove the tee wrappers + the ci.yml diagnostics
    # step after the root cause is fixed.
    - name: Lint
      run: |
        pnpm lint 2>&1 | tee /tmp/gate-lint.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Typecheck
      run: |
        pnpm typecheck 2>&1 | tee /tmp/gate-typecheck.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Test
      run: |
        pnpm test 2>&1 | tee /tmp/gate-test.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Config consistency (nav/locale 3-place check)
      run: |
        pnpm check-config 2>&1 | tee /tmp/gate-config.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Build
      run: |
        pnpm build 2>&1 | tee /tmp/gate-build.log
        exit ${PIPESTATUS[0]}
      shell: bash
      env:
        # FORKS: set a repository variable SITE_URL (Settings → Secrets and
        # variables → Actions → Variables) to your domain — otherwise CI
        # falls back to the demo domain and the built canonical/sitemap
        # point at the wrong site (production builds use wrangler.toml,
        # which this does not affect).
        SITE_URL: ${{ inputs.site-url }}

    - name: Content lint (H1/alt/slashes)
      run: |
        pnpm check-content 2>&1 | tee /tmp/gate-content.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Internal link audit (dist/)
      run: |
        pnpm check-links 2>&1 | tee /tmp/gate-links.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: i18n UI key coverage (gate)
      run: |
        pnpm check-i18n --strict-ui 2>&1 | tee /tmp/gate-i18n.log
        exit ${PIPESTATUS[0]}
      shell: bash
