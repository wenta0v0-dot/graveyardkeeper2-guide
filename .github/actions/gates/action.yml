name: 'AnvilWiki quality gates'
description: >-
  The eight validation gates shared by CI and the content pipeline. Every gate
  can fail the run — a draft PR from the pipeline is only created after all
  eight pass, and CI blocks on the same definition, so the two paths verify
  content with the exact same standard — no drift between the workflows.
inputs:
  site-url:
    description: 'SITE_URL for the build step (CI passes vars.SITE_URL; falls back to the demo domain).'
    required: false
    default: 'https://anvil.wiki'

runs:
  using: 'composite'
  steps:
    # TEMPORARY DIAGNOSTICS (2026-10-27): CI fails inside this composite in
    # ~39s (lint or typecheck) on Linux while every gate passes locally on
    # Windows. Tee the two fast-failing steps and dump their tails into the
    # step summary + ::error:: annotations, which are readable via the public
    # API without admin rights (job logs are not). Remove after the root
    # cause is fixed.
    - name: Lint
      run: |
        pnpm lint 2>&1 | tee /tmp/gate-lint.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Typecheck
      run: |
        pnpm typecheck 2>&1 | tee /tmp/gate-typecheck.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Test
      run: pnpm test
      shell: bash

    - name: Config consistency (nav/locale 3-place check)
      run: pnpm check-config
      shell: bash

    - name: Diagnostics — dump failed gate logs (temporary)
      if: always()
      run: |
        {
          echo "## gate: lint (tail)"
          tail -c 4000 /tmp/gate-lint.log 2>/dev/null || echo "(lint did not run)"
          echo "## gate: typecheck (tail)"
          tail -c 4000 /tmp/gate-typecheck.log 2>/dev/null || echo "(typecheck did not run)"
        } >> "$GITHUB_STEP_SUMMARY"
        grep -E "error|Error|ELIFECYCLE" /tmp/gate-lint.log /tmp/gate-typecheck.log 2>/dev/null | head -20 | while IFS= read -r line; do echo "::error ::$line"; done
      shell: bash

    - name: Build
      run: pnpm build
      shell: bash
      env:
        # FORKS: set a repository variable SITE_URL (Settings → Secrets and
        # variables → Actions → Variables) to your domain — otherwise CI
        # falls back to the demo domain and the built canonical/sitemap
        # point at the wrong site (production builds use wrangler.toml,
        # which this does not affect).
        SITE_URL: ${{ inputs.site-url }}

    - name: Content lint (H1/alt/slashes)
      run: pnpm check-content
      shell: bash

    - name: Internal link audit (dist/)
      run: pnpm check-links
      shell: bash

    - name: i18n UI key coverage (gate)
      run: pnpm check-i18n --strict-ui
      shell: bash
